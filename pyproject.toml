[project]
name = "blindspot"
version = "0.1.0"
description = "BlindSpot — Production-to-Test Gap Intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Optional: an approximate-nearest-neighbour index. BlindSpot falls back to an
# exact numpy store automatically when it is absent.
faiss = ["faiss-cpu>=1.8"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]
# Generated fixtures, including a deliberately malformed module used to prove
# that one bad file cannot abort an indexing run.
exclude = ["data", "frontend/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # long lines are allowed in prose-heavy docstrings
    "B008",   # FastAPI's Depends()/File() defaults are the documented idiom
    "UP042",  # `(str, Enum)` is kept over StrEnum for JSON-serialisation parity
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402"]  # test env must be configured before app import
